server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;
  charset utf-8;
  charset_types text/plain text/css text/xml application/xml application/javascript application/json text/markdown application/rss+xml application/manifest+json image/svg+xml;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css text/xml text/markdown application/xml application/javascript application/json application/rss+xml application/manifest+json image/svg+xml;

  # security headers (repeated in every location because add_header does not inherit)
  set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.github.com https://github-contributions-api.jogruber.de; frame-src https:; media-src 'self' https:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
  }

  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|mp3|m4a|mp4|webm)$ {
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location ~* \.(txt|md|xml)$ {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  error_page 404 /404.html;
}
