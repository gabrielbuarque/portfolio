<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de melhoria com IA e julgamento humano</title>
  <desc id="desc">Perceber um atrito, definir um resultado verificável, usar IA para acelerar a execução e revisar para aprender e melhorar.</desc>
  <rect width="1200" height="500" rx="28" fill="#161614"/>
  <text x="64" y="74" fill="#f2f0ea" font-family="Arial,sans-serif" font-size="30" font-weight="600">A IA acelera a execução. Você fecha o ciclo.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(62 150)"><rect width="240" height="190" rx="18" fill="#20201d" stroke="#55534e"/><text x="24" y="48" fill="#f28b54" font-size="15" font-weight="700" letter-spacing="1">1 · PERCEBER</text><text x="24" y="95" fill="#f2f0ea" font-size="22" font-weight="600">Onde há atrito?</text><text x="24" y="132" fill="#b7b3aa" font-size="16">Um processo lento,</text><text x="24" y="157" fill="#b7b3aa" font-size="16">confuso ou repetitivo.</text></g>
    <g transform="translate(354 150)"><rect width="240" height="190" rx="18" fill="#20201d" stroke="#55534e"/><text x="24" y="48" fill="#f28b54" font-size="15" font-weight="700" letter-spacing="1">2 · DEFINIR</text><text x="24" y="95" fill="#f2f0ea" font-size="22" font-weight="600">Como saber?</text><text x="24" y="132" fill="#b7b3aa" font-size="16">Defina o resultado</text><text x="24" y="157" fill="#b7b3aa" font-size="16">que será conferido.</text></g>
    <g transform="translate(646 150)"><rect width="240" height="190" rx="18" fill="#20201d" stroke="#f28b54" stroke-width="2"/><text x="24" y="48" fill="#f28b54" font-size="15" font-weight="700" letter-spacing="1">3 · ACELERAR</text><text x="24" y="95" fill="#f2f0ea" font-size="22" font-weight="600">Use a IA na execução</text><text x="24" y="132" fill="#b7b3aa" font-size="16">Explore, rascunhe ou</text><text x="24" y="157" fill="#b7b3aa" font-size="16">automatize uma etapa.</text></g>
    <g transform="translate(938 150)"><rect width="200" height="190" rx="18" fill="#20201d" stroke="#55534e"/><text x="24" y="48" fill="#f28b54" font-size="15" font-weight="700" letter-spacing="1">4 · REVISAR</text><text x="24" y="95" fill="#f2f0ea" font-size="22" font-weight="600">Confira</text><text x="24" y="132" fill="#b7b3aa" font-size="16">Aprenda com o</text><text x="24" y="157" fill="#b7b3aa" font-size="16">resultado e ajuste.</text></g>
  </g>
  <g stroke="#f28b54" stroke-width="3" fill="none"><path d="M310 245h34m-12-12 12 12-12 12"/><path d="M602 245h34m-12-12 12 12-12 12"/><path d="M894 245h34m-12-12 12 12-12 12"/><path d="M1038 357c0 48-430 66-570 28"/><path d="M480 377l-15 7 13 11"/></g>
  <text x="64" y="438" fill="#8e8b83" font-family="Arial,sans-serif" font-size="16">A revisão preserva a prática e ajuda a decidir se a mudança valeu a pena.</text>
</svg>
