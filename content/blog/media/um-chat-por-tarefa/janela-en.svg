<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img"><rect width="1200" height="660" rx="20" fill="#161614"/><defs><pattern id="st" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f28b54"/><rect width="4" height="10" fill="#d9733f"/></pattern></defs><text x="60" y="62" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="600" fill="#f2f0ea" text-anchor="start">One single conversation</text><text x="60" y="92" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="400" fill="#9a978f" text-anchor="start">The whole PDF and every question in the same window</text><rect x="60" y="116" width="1080" height="56" rx="10" fill="#1f1f1c" stroke="#2c2c28"/><rect x="60" y="116" width="864" height="56" rx="10" fill="url(#st)"/><rect x="924" y="116" width="162" height="56" fill="#3a3631"/><text x="80" y="152" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="600" fill="#1a0f08" text-anchor="start">70+ page PDF  ·  ~80%</text><text x="1005" y="152" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#f2f0ea" text-anchor="middle">questions</text><rect x="708" y="108" width="108" height="72" fill="none" stroke="#f2f0ea" stroke-dasharray="5 5" rx="6"/><text x="762" y="212" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="400" fill="#f2f0ea" text-anchor="middle">quality starts to drop</text><text x="762" y="234" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#9a978f" text-anchor="middle">~60–70% (in my experience)</text><text x="60" y="340" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="600" fill="#f2f0ea" text-anchor="start">One chat per task</text><text x="60" y="370" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="400" fill="#9a978f" text-anchor="start">Each conversation starts with only the summary and what the task needs</text><text x="60" y="423" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#9a978f" text-anchor="start">documents</text><rect x="290" y="396" width="850" height="36" rx="8" fill="#1f1f1c" stroke="#2c2c28"/><rect x="290" y="396" width="42.5" height="36" rx="8" fill="#f28b54"/><rect x="332.5" y="396" width="85" height="36" fill="#3a3631"/><text x="434.5" y="420" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="400" fill="#9a978f" text-anchor="start">free room to work</text><text x="60" y="473" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#9a978f" text-anchor="start">fields</text><rect x="290" y="446" width="850" height="36" rx="8" fill="#1f1f1c" stroke="#2c2c28"/><rect x="290" y="446" width="42.5" height="36" rx="8" fill="#f28b54"/><rect x="332.5" y="446" width="85" height="36" fill="#3a3631"/><text x="60" y="523" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#9a978f" text-anchor="start">answers</text><rect x="290" y="496" width="850" height="36" rx="8" fill="#1f1f1c" stroke="#2c2c28"/><rect x="290" y="496" width="42.5" height="36" rx="8" fill="#f28b54"/><rect x="332.5" y="496" width="85" height="36" fill="#3a3631"/><text x="60" y="573" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#9a978f" text-anchor="start">fill in</text><rect x="290" y="546" width="850" height="36" rx="8" fill="#1f1f1c" stroke="#2c2c28"/><rect x="290" y="546" width="42.5" height="36" rx="8" fill="#f28b54"/><rect x="332.5" y="546" width="85" height="36" fill="#3a3631"/><rect x="60" y="617" width="16" height="16" rx="3" fill="url(#st)"/><text x="84" y="630" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="400" fill="#9a978f" text-anchor="start">whole document</text><rect x="290" y="617" width="16" height="16" rx="3" fill="#f28b54"/><text x="314" y="630" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="400" fill="#9a978f" text-anchor="start">summary (~5%)</text><rect x="540" y="617" width="16" height="16" rx="3" fill="#3a3631"/><text x="564" y="630" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="400" fill="#9a978f" text-anchor="start">task work</text><rect x="820" y="617" width="16" height="16" rx="3" fill="#1f1f1c" stroke="#2c2c28"/><text x="844" y="630" font-family="Geist, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="400" fill="#9a978f" text-anchor="start">free context</text></svg>
