<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Do documento longo a uma tarefa conferível</title>
  <desc id="desc">Quatro etapas: documento completo, resumo com referências, contexto específico por tarefa e conferência com a fonte original.</desc>
  <rect width="1200" height="500" rx="28" fill="#161614"/>
  <text x="64" y="74" fill="#f2f0ea" font-family="Arial,sans-serif" font-size="30" font-weight="600">Menos contexto por tarefa. Mais contexto útil.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(56 145)"><rect width="235" height="230" rx="18" fill="#20201d" stroke="#55534e"/><circle cx="34" cy="34" r="18" fill="#f28b54"/><text x="34" y="41" fill="#161614" text-anchor="middle" font-size="18" font-weight="700">1</text><text x="26" y="92" fill="#f2f0ea" font-size="24" font-weight="600">Documento</text><text x="26" y="128" fill="#b7b3aa" font-size="17">Regras, prazos,</text><text x="26" y="154" fill="#b7b3aa" font-size="17">critérios e anexos</text><text x="26" y="198" fill="#8e8b83" font-size="14">Fonte completa</text></g>
    <g transform="translate(354 145)"><rect width="235" height="230" rx="18" fill="#20201d" stroke="#55534e"/><circle cx="34" cy="34" r="18" fill="#f28b54"/><text x="34" y="41" fill="#161614" text-anchor="middle" font-size="18" font-weight="700">2</text><text x="26" y="92" fill="#f2f0ea" font-size="24" font-weight="600">Mapa</text><text x="26" y="128" fill="#b7b3aa" font-size="17">Resumo com páginas,</text><text x="26" y="154" fill="#b7b3aa" font-size="17">dúvidas e evidências</text><text x="26" y="198" fill="#8e8b83" font-size="14">Ligado à fonte</text></g>
    <g transform="translate(652 145)"><rect width="235" height="230" rx="18" fill="#20201d" stroke="#f28b54" stroke-width="2"/><circle cx="34" cy="34" r="18" fill="#f28b54"/><text x="34" y="41" fill="#161614" text-anchor="middle" font-size="18" font-weight="700">3</text><text x="26" y="92" fill="#f2f0ea" font-size="24" font-weight="600">Novo chat</text><text x="26" y="128" fill="#b7b3aa" font-size="17">Resumo e dados</text><text x="26" y="154" fill="#b7b3aa" font-size="17">desta tarefa</text><text x="26" y="198" fill="#f28b54" font-size="14">Contexto direcionado</text></g>
    <g transform="translate(950 145)"><rect width="195" height="230" rx="18" fill="#20201d" stroke="#55534e"/><circle cx="34" cy="34" r="18" fill="#f28b54"/><text x="34" y="41" fill="#161614" text-anchor="middle" font-size="18" font-weight="700">4</text><text x="26" y="92" fill="#f2f0ea" font-size="24" font-weight="600">Conferir</text><text x="26" y="128" fill="#b7b3aa" font-size="17">Validar na fonte</text><text x="26" y="154" fill="#b7b3aa" font-size="17">original</text><text x="26" y="198" fill="#8e8b83" font-size="14">Revisão humana</text></g>
  </g>
  <g stroke="#f28b54" stroke-width="3" fill="none"><path d="M302 260h38m-12-12 12 12-12 12"/><path d="M600 260h38m-12-12 12 12-12 12"/><path d="M898 260h38m-12-12 12 12-12 12"/></g>
  <text x="64" y="438" fill="#8e8b83" font-family="Arial,sans-serif" font-size="16">Use o resumo como mapa de trabalho, não como substituto do documento.</text>
</svg>
