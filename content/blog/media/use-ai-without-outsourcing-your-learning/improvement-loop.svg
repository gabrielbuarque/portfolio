<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">An AI improvement loop with human judgment</title>
  <desc id="desc">Notice friction, define a verifiable outcome, use AI to speed up execution, then review to learn and improve.</desc>
  <rect width="1200" height="500" rx="28" fill="#161614"/>
  <text x="64" y="74" fill="#f2f0ea" font-family="Arial,sans-serif" font-size="30" font-weight="600">AI speeds up execution. You close the loop.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(62 150)"><rect width="240" height="190" rx="18" fill="#20201d" stroke="#55534e"/><text x="24" y="48" fill="#f28b54" font-size="15" font-weight="700" letter-spacing="1">1 · NOTICE</text><text x="24" y="95" fill="#f2f0ea" font-size="22" font-weight="600">Where is the friction?</text><text x="24" y="132" fill="#b7b3aa" font-size="16">A slow, confusing,</text><text x="24" y="157" fill="#b7b3aa" font-size="16">or repetitive process.</text></g>
    <g transform="translate(354 150)"><rect width="240" height="190" rx="18" fill="#20201d" stroke="#55534e"/><text x="24" y="48" fill="#f28b54" font-size="15" font-weight="700" letter-spacing="1">2 · DEFINE</text><text x="24" y="95" fill="#f2f0ea" font-size="22" font-weight="600">How do you know?</text><text x="24" y="132" fill="#b7b3aa" font-size="16">Define the outcome</text><text x="24" y="157" fill="#b7b3aa" font-size="16">you will check.</text></g>
    <g transform="translate(646 150)"><rect width="240" height="190" rx="18" fill="#20201d" stroke="#f28b54" stroke-width="2"/><text x="24" y="48" fill="#f28b54" font-size="15" font-weight="700" letter-spacing="1">3 · SPEED UP</text><text x="24" y="95" fill="#f2f0ea" font-size="22" font-weight="600">Use AI to execute</text><text x="24" y="132" fill="#b7b3aa" font-size="16">Explore, draft, or</text><text x="24" y="157" fill="#b7b3aa" font-size="16">automate a step.</text></g>
    <g transform="translate(938 150)"><rect width="200" height="190" rx="18" fill="#20201d" stroke="#55534e"/><text x="24" y="48" fill="#f28b54" font-size="15" font-weight="700" letter-spacing="1">4 · REVIEW</text><text x="24" y="95" fill="#f2f0ea" font-size="22" font-weight="600">Check</text><text x="24" y="132" fill="#b7b3aa" font-size="16">Learn from the</text><text x="24" y="157" fill="#b7b3aa" font-size="16">result and adjust.</text></g>
  </g>
  <g stroke="#f28b54" stroke-width="3" fill="none"><path d="M310 245h34m-12-12 12 12-12 12"/><path d="M602 245h34m-12-12 12 12-12 12"/><path d="M894 245h34m-12-12 12 12-12 12"/><path d="M1038 357c0 48-430 66-570 28"/><path d="M480 377l-15 7 13 11"/></g>
  <text x="64" y="438" fill="#8e8b83" font-family="Arial,sans-serif" font-size="16">Review preserves practice and helps you decide whether the change was worth it.</text>
</svg>
